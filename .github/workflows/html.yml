name: HTML presentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2_X11_Latex
      options: --user root
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Build sessions with HTML presentation
        run: |
          # The image keeps Isabelle and its prebuilt heaps under /home/isabelle.
          export HOME=/home/isabelle
          ISABELLE=/home/isabelle/Isabelle/bin/isabelle
          "$ISABELLE" build -b -v -o browser_info -o document=pdf -o "threads=$(nproc)" \
            -d HOLCF-extra -d DataAnalyticsLang HOLCF-extra DataAnalyticsLang
          INFO=$("$ISABELLE" getenv -b ISABELLE_BROWSER_INFO)
          mkdir -p site/Unsorted
          cp -r "$INFO/fonts" site/
          cp -r "$INFO/Unsorted/DataAnalyticsLang" "$INFO/Unsorted/HOLCF-extra" site/Unsorted/
          cat > site/index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=Unsorted/DataAnalyticsLang/index.html">
          <title>Isabelle Developments</title></head>
          <body><p><a href="Unsorted/DataAnalyticsLang/index.html">DataAnalyticsLang</a> &middot;
          <a href="Unsorted/HOLCF-extra/index.html">HOLCF-extra</a></p></body></html>
          EOF
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
